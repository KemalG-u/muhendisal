[project]
name = "tahta-asistani"
version = "0.1.0"
description = "Tahta fotoğrafı → ders özeti + quiz (Claude vision + FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "anthropic==2.12.0",
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.34",
    "pydantic==2.14.4",
    "pillow==13.0.0",
    "python-json-logger==4.2.0",
    "slowapi==0.1.10",
    "tenacity==9.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "httpx==0.28.1",
    "ruff==0.17.6",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
extend-exclude = ["tests/test_main.py"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
