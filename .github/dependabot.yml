version: 2
updates:
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/backend"
      - "/examples/icerik-ozet-agent"
      - "/examples/rag-chatbot"
      - "/examples/semantic-search"
      - "/examples/tahta-asistani"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      all-updates:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      all-updates:
        patterns: ["*"]
