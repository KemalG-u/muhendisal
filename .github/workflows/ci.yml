# CI: run the example projects' test suites on every push and pull request.
# Least privilege: top-level read-only token; third-party actions pinned to full commit SHAs (version in the comment).
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [semantic-search, rag-chatbot, tahta-asistani, icerik-ozet-agent]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        working-directory: examples/${{ matrix.example }}
        run: python -m pip install -e ".[dev]"
      - name: Test
        working-directory: examples/${{ matrix.example }}
        run: python -m pytest -q
